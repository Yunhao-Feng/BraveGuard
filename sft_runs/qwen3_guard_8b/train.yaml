model_name_or_path: "model_cache/qwen3_guard_8b"
stage: "sft"
do_train: true
finetuning_type: "lora"
template: "qwen3"
dataset: "braveguard_sft"
dataset_dir: "sft_runs/qwen3_guard_8b/data"
cutoff_len: 16000
output_dir: "sft_runs/qwen3_guard_8b/adapter"
overwrite_cache: true
overwrite_output_dir: true
preprocessing_num_workers: 8
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 2e-05
num_train_epochs: 50.0
lr_scheduler_type: "cosine"
warmup_ratio: 0.1
logging_steps: 1
save_strategy: "epoch"
save_steps: 100
save_total_limit: 2
plot_loss: true
bf16: true
gradient_checkpointing: true
enable_thinking: false
eval_dataset: "braveguard_sft_eval"
val_size: 0.0
do_eval: true
eval_strategy: "epoch"
eval_steps: 50
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
greater_is_better: false
per_device_eval_batch_size: 1
compute_accuracy: true
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: "all"
