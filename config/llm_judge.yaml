# LLM Judge API configuration

api:
  base_url: "https://your-api-endpoint.example.com/v1"
  api_keys:
    - "YOUR_API_KEY_1"
    - "YOUR_API_KEY_2"
    - "YOUR_API_KEY_3"

execution:
  concurrency_per_key: 8
  max_retries: 5
  retry_delays: [1, 1, 1, 1, 1]
  timeout: 60

judge_models:
  - "your-judge-model"

paths:
  trajectories_dir: "tmp/workspace/data/agenthazard_strongest"
  dataset_json: "data/agenthazard_strongest.json"
  output_file: "llm_judge_results.txt"
